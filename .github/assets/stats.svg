<svg xmlns="http://www.w3.org/2000/svg" width="880" height="132" viewBox="0 0 880 132" role="img" aria-label="Mobius Guard in four numbers"><title>Mobius Guard in four numbers</title><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}</style><rect width="880" height="132" rx="14" fill="#F7F8F9"/><rect x="16.0" y="16" width="203.0" height="100" rx="10" fill="#FFFFFF" stroke="#DDE1E6"/><rect x="16.0" y="16" width="4" height="100" rx="2" fill="#F5B301"/><text x="36.0" y="58" font-size="28" font-weight="700" fill="#1B1E23">0 / 15,000</text><text x="36.0" y="82" font-size="14" font-weight="600" fill="#1B1E23">secrets leaked</text><text x="36.0" y="102" font-size="12" fill="#6B7480">exact and garbled</text><rect x="231.0" y="16" width="203.0" height="100" rx="10" fill="#FFFFFF" stroke="#DDE1E6"/><rect x="231.0" y="16" width="4" height="100" rx="2" fill="#F5B301"/><text x="251.0" y="58" font-size="28" font-weight="700" fill="#1B1E23">0 / 23,221</text><text x="251.0" y="82" font-size="14" font-weight="600" fill="#1B1E23">benign texts blocked</text><text x="251.0" y="102" font-size="12" fill="#6B7480">by the request rules</text><rect x="446.0" y="16" width="203.0" height="100" rx="10" fill="#FFFFFF" stroke="#DDE1E6"/><rect x="446.0" y="16" width="4" height="100" rx="2" fill="#F5B301"/><text x="466.0" y="58" font-size="28" font-weight="700" fill="#1B1E23">0.15 ms</text><text x="466.0" y="82" font-size="14" font-weight="600" fill="#1B1E23">per streamed token</text><text x="466.0" y="102" font-size="12" fill="#6B7480">245 patterns, one CPU core</text><rect x="661.0" y="16" width="203.0" height="100" rx="10" fill="#FFFFFF" stroke="#DDE1E6"/><rect x="661.0" y="16" width="4" height="100" rx="2" fill="#F5B301"/><text x="681.0" y="58" font-size="28" font-weight="700" fill="#1B1E23">≈ 1 word</text><text x="681.0" y="82" font-size="14" font-weight="600" fill="#1B1E23">of delay</text><text x="681.0" y="102" font-size="12" fill="#6B7480">3 characters at the median</text></svg>
