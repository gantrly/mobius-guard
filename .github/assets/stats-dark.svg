<svg xmlns="http://www.w3.org/2000/svg" width="880" height="132" viewBox="0 0 880 132" role="img" aria-label="Mobius Guard in four numbers"><title>Mobius Guard in four numbers</title><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}</style><rect width="880" height="132" rx="14" fill="#121418"/><rect x="16.0" y="16" width="203.0" height="100" rx="10" fill="#1B1E23" stroke="#2C3239"/><rect x="16.0" y="16" width="4" height="100" rx="2" fill="#F5B301"/><text x="36.0" y="58" font-size="28" font-weight="700" fill="#E8EBEE">0 / 15,000</text><text x="36.0" y="82" font-size="14" font-weight="600" fill="#E8EBEE">secrets leaked</text><text x="36.0" y="102" font-size="12" fill="#9AA3AE">exact and garbled</text><rect x="231.0" y="16" width="203.0" height="100" rx="10" fill="#1B1E23" stroke="#2C3239"/><rect x="231.0" y="16" width="4" height="100" rx="2" fill="#F5B301"/><text x="251.0" y="58" font-size="28" font-weight="700" fill="#E8EBEE">0 / 23,221</text><text x="251.0" y="82" font-size="14" font-weight="600" fill="#E8EBEE">benign texts blocked</text><text x="251.0" y="102" font-size="12" fill="#9AA3AE">by the request rules</text><rect x="446.0" y="16" width="203.0" height="100" rx="10" fill="#1B1E23" stroke="#2C3239"/><rect x="446.0" y="16" width="4" height="100" rx="2" fill="#F5B301"/><text x="466.0" y="58" font-size="28" font-weight="700" fill="#E8EBEE">0.15 ms</text><text x="466.0" y="82" font-size="14" font-weight="600" fill="#E8EBEE">per streamed token</text><text x="466.0" y="102" font-size="12" fill="#9AA3AE">245 patterns, one CPU core</text><rect x="661.0" y="16" width="203.0" height="100" rx="10" fill="#1B1E23" stroke="#2C3239"/><rect x="661.0" y="16" width="4" height="100" rx="2" fill="#F5B301"/><text x="681.0" y="58" font-size="28" font-weight="700" fill="#E8EBEE">≈ 1 word</text><text x="681.0" y="82" font-size="14" font-weight="600" fill="#E8EBEE">of delay</text><text x="681.0" y="102" font-size="12" fill="#9AA3AE">3 characters at the median</text></svg>
