version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Update uv.lock only: CI tests the newest versions, while the published packages keep
    # their wide ranges (raising "torch>=2.5" to the latest would force users to upgrade).
    versioning-strategy: lockfile-only
    labels: [dependencies]
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
