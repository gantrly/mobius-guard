name: DCO

# Every commit in a pull request carries a Signed-off-by line (CONTRIBUTING.md). Bot
# commits (Dependabot) are exempt.

on: pull_request

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            case "$author" in *"[bot]"*) continue ;; esac
            if ! git log -1 --format='%B' "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::$c by $author has no Signed-off-by line; amend it with git commit --amend -s"
              bad=1
            fi
          done
          exit $bad
