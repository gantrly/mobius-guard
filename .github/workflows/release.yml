name: Release

# Runs when a version tag (v0.1.0, ...) is pushed: checks, builds, tests the wheels in a
# clean environment, then publishes to PyPI with trusted publishing (no stored token).
# See docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: make check
      - name: The tag matches every package version
        run: |
          want="${GITHUB_REF_NAME#v}"
          for m in mobiusguard_redact mobiusguard mobiusguard_eval; do
            got=$(uv run python -c "import $m; print($m.__version__)")
            [ "$got" = "$want" ] || { echo "$m is $got, the tag says $want"; exit 1; }
          done
      - run: uv build --all-packages
      - name: Install the wheels in a clean environment and try them
        run: scripts/check_dist.sh dist
      - run: uv publish --trusted-publishing always
