name: Release

# Runs on a version tag (v0.1.0, ...): pushed by a maintainer, or started on the tag by the
# Tag release workflow when a release PR is merged. It checks, builds, tests the wheels in a
# clean environment and attests where they were built; then publishes each package to PyPI
# with trusted publishing (no stored token), each from its own GitHub environment because
# PyPI accepts a publisher configuration for one project only; then creates the GitHub
# release with the changelog entry, the files, and the build provenance as files too
# (a Sigstore bundle and its in-toto envelope), so it can be checked offline. See
# docs/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # on a tag only; started by tag-release.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Only from a version tag
        run: |
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "run this on a v* tag, not $GITHUB_REF"; exit 1 ;; esac
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: make check
      - name: The tag matches every package version
        run: |
          want="${GITHUB_REF_NAME#v}"
          for m in mobiusguard_redact mobiusguard mobiusguard_eval; do
            got=$(uv run python -c "import $m; print($m.__version__)")
            [ "$got" = "$want" ] || { echo "$m is $got, the tag says $want"; exit 1; }
          done
      - run: uv build --all-packages
      - name: Install the wheels in a clean environment and try them
        run: scripts/check_dist.sh dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with: # not dist/* : uv also writes a .gitignore there
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: The provenance as release files
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir provenance
          name="mobius-guard-$GITHUB_REF_NAME"
          cp "$BUNDLE" "provenance/$name.sigstore.json"
          jq -c .dsseEnvelope "$BUNDLE" > "provenance/$name.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: provenance/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # All three wait for approval at once (one "Review deployments" dialog); if one
      # upload fails the others stop, and re-running the job skips files already uploaded.
      matrix:
        include:
          - { project: mobiusguard-redact, files: mobiusguard_redact }
          - { project: mobiusguard, files: mobiusguard }
          - { project: mobiusguard-eval, files: mobiusguard_eval }
    environment:
      name: pypi-${{ matrix.project }}
      url: https://pypi.org/project/${{ matrix.project }}/
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Only ${{ matrix.project }}'s files
        env:
          FILES: ${{ matrix.files }}
        run: mkdir upload && mv dist/"$FILES"-* upload/ && ls upload
      # Trusted publishing, and PEP 740 attestations on PyPI for each file.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: upload/

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
          path: provenance/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* provenance/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Mobius Guard $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
