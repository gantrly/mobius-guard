name: Fuzz

# Atheris (coverage-guided) drives the redactor's core property through Hypothesis: the
# output must be the same however the text is split (fuzz/redactor.py). A few minutes on
# pull requests that touch the redactor, twenty minutes once a week. Inputs that fail are
# kept as an artifact.

on:
  pull_request:
    paths:
      - "packages/mobiusguard-redact/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked --group fuzz
      - name: Fuzz the redactor
        env:
          SECONDS_TO_RUN: ${{ github.event_name == 'pull_request' && '180' || '1200' }}
        run: |
          mkdir -p crashes
          uv run python fuzz/redactor.py -max_total_time="$SECONDS_TO_RUN" -timeout=60 \
            -artifact_prefix=crashes/
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: crashes/
