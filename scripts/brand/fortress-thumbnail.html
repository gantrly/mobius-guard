<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#14161a;color:#eceef1;font-family:Geist,system-ui,sans-serif;overflow:hidden}
  .wall{position:absolute;left:72px;right:72px;top:150px;height:34px;background:#f5b301;
    -webkit-mask:linear-gradient(90deg,#000 0 32px,transparent 32px 72px,#000 72px 104px) 0 0/104px 100% round}
  .gate{position:absolute;left:72px;right:72px;top:182px;bottom:72px;background:#1c1f24;border-top:6px solid #f5b301;border-radius:0 0 22px 22px;padding:44px 56px}
  .brand{position:absolute;left:72px;top:58px;display:flex;align-items:center;gap:16px;font-size:30px;font-weight:600}
  .brand svg{width:52px;height:52px}
  .brand small{font-size:22px;font-weight:400;color:#8a919b}
  h1{margin:0;font-size:58px;line-height:1.05;letter-spacing:-0.025em;font-weight:700;max-width:900px}
  p{margin:18px 0 0;font-size:26px;color:#b7bdc6}
  .facts{display:flex;gap:48px;margin-top:40px}
  .facts b{display:block;font-size:40px;font-weight:700;color:#f5b301;letter-spacing:-0.02em}
  .facts span{font-size:20px;color:#b7bdc6}
</style></head><body>
<div class="brand"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#F5B301"/><g transform="translate(9.6 9.6) scale(0.7)" fill="#1B1E23"><rect x="8" y="10" width="48" height="10" rx="2"/><rect x="10" y="20" width="10" height="36" rx="2"/><rect x="44" y="20" width="10" height="36" rx="2"/><rect x="22" y="31" width="20" height="10" rx="5"/></g></svg>Fortress-XS <small>by Gantrly</small></div>
<div class="wall"></div>
<div class="gate">
  <h1>Check text before your model reads it.</h1>
  <p>Prompt injection and harmful requests, flagged in your browser.</p>
  <div class="facts">
    <div><b>66%</b><span>average recall, 9 held-out attack sets</span></div>
    <div><b>183 ms</b><span>on a CPU, 512 tokens</span></div>
    <div><b>81 MB</b><span>INT8 ONNX, Apache-2.0</span></div>
  </div>
</div>
</body></html>
