[project]
name = "mobiusguard"
dynamic = ["version"]
description = "Open-source LLM firewall proxy for OpenAI and Anthropic APIs: prompt-injection checks on the way in (with Fortress-XS, its own CPU classifier), streaming secret and PII redaction on the way out, audit log; one base URL to change."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "SK Imtiaj Uddin" }]
keywords = ["llm", "firewall", "proxy", "prompt-injection", "jailbreak", "guardrails", "redaction", "pii", "ai-security", "openai", "anthropic", "llm-gateway", "classifier", "onnx", "jailbreak-detection", "llm-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: System Administrators",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.28",
    "mobiusguard-redact>=0.2.0,<0.3",
    "starlette>=0.46",
    "uvicorn>=0.34",
]

[project.scripts]
mobiusguard = "mobiusguard.cli:main"

[project.urls]
Homepage = "https://github.com/gantrly/mobius-guard"
Documentation = "https://github.com/gantrly/mobius-guard/tree/main/docs"
Changelog = "https://github.com/gantrly/mobius-guard/blob/main/CHANGELOG.md"
Source = "https://github.com/gantrly/mobius-guard"
Issues = "https://github.com/gantrly/mobius-guard/issues"
Security = "https://github.com/gantrly/mobius-guard/blob/main/SECURITY.md"
Releases = "https://github.com/gantrly/mobius-guard/releases"
Model = "https://huggingface.co/gantrly/fortress-xs"
Demo = "https://huggingface.co/spaces/gantrly/fortress-xs"

[project.optional-dependencies]
onnx = [
    "huggingface-hub>=0.26",
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]
classifier = [
    "torch>=2.5",
    "transformers>=4.46",
]
otel = [
    "opentelemetry-api>=1.28",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mobiusguard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mobiusguard"]
