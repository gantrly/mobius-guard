[project]
name = "mobiusguard"
dynamic = ["version"]
description = "Mobius Guard: an OpenAI-compatible LLM firewall proxy with streaming redaction and an honest, held-out evaluation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "SK Imtiaj Uddin" }]
keywords = ["llm", "security", "prompt-injection", "guardrails", "redaction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "mobiusguard-redact>=0.1.0,<0.2",
    "starlette>=0.46",
    "uvicorn>=0.34",
]

[project.scripts]
mobiusguard = "mobiusguard.cli:main"

[project.urls]
Homepage = "https://github.com/gantrly/mobius-guard"
Issues = "https://github.com/gantrly/mobius-guard/issues"

[project.optional-dependencies]
classifier = [
    "torch>=2.5",
    "transformers>=4.46",
]
otel = [
    "opentelemetry-api>=1.28",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mobiusguard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mobiusguard"]
