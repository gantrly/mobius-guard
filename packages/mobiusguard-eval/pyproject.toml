[project]
name = "mobiusguard-eval"
version = "0.0.0"
description = "Evaluation harness for LLM guardrails: held-out attack families, false-positive sets, recall at fixed FPR and CPU latency."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "SK Imtiaj Uddin" }]
keywords = ["llm", "security", "prompt-injection", "guardrails", "redaction"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
    "huggingface-hub>=0.26",
    "mobiusguard-redact",
    "numpy>=2.0",
    "pyarrow>=18",
]

[project.scripts]
mobiusguard-eval = "mobiusguard_eval.cli:main"

[project.urls]
Homepage = "https://github.com/gantrly/mobius-guard"
Issues = "https://github.com/gantrly/mobius-guard/issues"

[project.optional-dependencies]
sklearn = [
    "scikit-learn>=1.5",
]
hf = [
    "torch>=2.5",
    "transformers>=4.46",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mobiusguard_eval"]

[tool.uv.sources]
mobiusguard-redact = { workspace = true }
