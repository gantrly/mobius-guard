[project]
name = "mobiusguard-eval"
dynamic = ["version"]
description = "Honest evaluation harness for LLM guardrails: prompt-injection detectors scored on held-out attack families at a fixed false-positive rate, with pinned datasets, a provenance ledger and CPU latency."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "SK Imtiaj Uddin" }]
keywords = ["llm", "evaluation", "benchmark", "prompt-injection", "guardrails", "ai-security", "red-teaming", "redaction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "huggingface-hub>=0.26",
    "mobiusguard>=0.1.2,<0.2",
    "mobiusguard-redact>=0.1.2,<0.2",
    "numpy>=2.0",
    "pyarrow>=18",
]

[project.scripts]
mobiusguard-eval = "mobiusguard_eval.cli:main"

[project.urls]
Homepage = "https://github.com/gantrly/mobius-guard"
Documentation = "https://github.com/gantrly/mobius-guard/tree/main/docs"
Changelog = "https://github.com/gantrly/mobius-guard/blob/main/CHANGELOG.md"
Source = "https://github.com/gantrly/mobius-guard"
Issues = "https://github.com/gantrly/mobius-guard/issues"
Security = "https://github.com/gantrly/mobius-guard/blob/main/SECURITY.md"
Releases = "https://github.com/gantrly/mobius-guard/releases"

[project.optional-dependencies]
sklearn = [
    "scikit-learn>=1.5",
]
hf = [
    "torch>=2.5",
    "transformers>=4.46",
]
# Fine-tuning the v0.2 classifier (decision 0012): DeBERTa-v3's tokenizer needs
# sentencepiece and protobuf; the ONNX export, INT8 quantisation and parity check need the rest.
train = [
    "sentencepiece>=0.2",
    "protobuf>=5",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.2",
]
# The label-cleaning judges (Amazon Bedrock).
judge = [
    "boto3>=1.40",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mobiusguard_eval/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mobiusguard_eval"]

[tool.uv.sources]
mobiusguard-redact = { workspace = true }
mobiusguard = { workspace = true }
