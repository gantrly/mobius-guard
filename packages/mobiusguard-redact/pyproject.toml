[project]
name = "mobiusguard-redact"
dynamic = ["version"]
description = "Streaming secret and PII redaction for LLM output: rewrites API keys, tokens, private keys, cards and IBANs in a streamed reply, even split across chunks, without stopping the stream."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "SK Imtiaj Uddin" }]
keywords = ["llm", "redaction", "streaming", "secrets", "pii", "dlp", "data-loss-prevention", "gitleaks", "guardrails", "ai-security", "openai", "anthropic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
  "Operating System :: OS Independent",
  "Topic :: Text Processing :: Filters",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "regex>=2024.11.6",
]

[project.urls]
Homepage = "https://github.com/gantrly/mobius-guard"
Documentation = "https://github.com/gantrly/mobius-guard/tree/main/docs"
Changelog = "https://github.com/gantrly/mobius-guard/blob/main/CHANGELOG.md"
Source = "https://github.com/gantrly/mobius-guard"
Issues = "https://github.com/gantrly/mobius-guard/issues"
Security = "https://github.com/gantrly/mobius-guard/blob/main/SECURITY.md"
Releases = "https://github.com/gantrly/mobius-guard/releases"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mobiusguard_redact/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mobiusguard_redact"]
