# Workspace root. Not a package itself; the distributions live in packages/.
[project]
name = "mobiusguard-workspace"
version = "0"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mobiusguard-redact = { workspace = true }
mobiusguard = { workspace = true }
mobiusguard-eval = { workspace = true }

[dependency-groups]
dev = [
  "mobiusguard-redact",
  "mobiusguard",
  "mobiusguard-eval[sklearn]",
  "pytest>=9.2.0",
  "pytest-cov>=6.0",
  "hypothesis>=6.170.14",
  "ruff>=0.8",
  "pyright>=1.1.390",
  "pre-commit>=4.0",
  "types-regex>=2026.9.29.20261030",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # import order
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM",           # simplify
  "N",             # naming
  "S",             # bandit (security)
  "PT",            # pytest style
  "RUF",
  "ANN",           # public functions are typed
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S311", "ANN"]

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["packages"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
extraPaths = ["packages/mobiusguard-redact/tests"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["packages"]
pythonpath = ["packages/mobiusguard-redact/tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["packages"]
omit = ["**/tests/**"]
